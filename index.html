<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUST Calculator – Amputation Adjusted</title>

<style>
body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  margin: 20px;
  max-width: 820px;
  line-height: 1.55;
}

h1 {
  color: #003bb8;
}

.step-title {
  margin-top: 28px;
  font-size: 1.4rem;
  font-weight: 700;
  color: #003bb8;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: 600;
}

input, select {
  width: 100%;
  padding: 14px;
  margin-top: 6px;
  font-size: 1rem;
  border: 2px solid #d0d7ff;
  border-radius: 8px;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 16px;
  font-size: 1.2rem;
  font-weight: 700;
  background: #0057ff;
  color: white;
  border: none;
  border-radius: 8px;
}

button:active {
  background: #003bb8;
}

.result {
  margin-top: 26px;
  padding: 18px;
  background: #f2f5ff;
  border-radius: 10px;
  border: 1px solid #d0d7ff;
}

.warning {
  margin-top: 12px;
  padding: 12px;
  background: #fff7ed;
  border-left: 5px solid #f59e0b;
  font-weight: 600;
  color: #92400e;
}

hr {
  margin: 18px 0;
  border: 0;
  border-top: 2px solid #d0d7ff;
}

.risk-low { color: green; font-weight: 700; }
.risk-medium { color: #ff8c00; font-weight: 700; }
.risk-high { color: red; font-weight: 700; }
</style>
</head>

<body>

<h1>MUST – Amputation-Adjusted Calculator</h1>

<!-- STEP 1 -->
<div class="step-title">Step 1 — BMI</div>

<label>Height (m)
  <input id="heightM" type="number" step="0.01">
</label>

<label>Weight (kg)
  <input id="obsWeight" type="number" step="0.1">
</label>

<label>Current amputation
<select id="currentAmp">
  <option value="0">No amputation</option>

  <optgroup label="Lower limb (unilateral)">
    <option value="0.16">Full lower limb (16%)</option>
    <option value="0.097">Above knee / thigh (9.7%)</option>
    <option value="0.059">Below knee + foot (5.9%)</option>
    <option value="0.014">Foot (1.4%)</option>
    <option value="0.007">Half foot (0.7%)</option>
  </optgroup>

  <optgroup label="Lower limb (bilateral)">
    <option value="0.32">Full lower limbs (32%)</option>
    <option value="0.194">Above knee / thigh (19.4%)</option>
    <option value="0.118">Below knee + foot (11.8%)</option>
    <option value="0.028">Feet (2.8%)</option>
    <option value="0.014">Half feet (1.4%)</option>
  </optgroup>

  <optgroup label="Upper limb (unilateral)">
    <option value="0.05">Full upper limb (5%)</option>
    <option value="0.023">Forearm (2.3%)</option>
    <option value="0.007">Hand (0.7%)</option>
  </optgroup>

  <optgroup label="Upper limb (bilateral)">
    <option value="0.10">Full upper limbs (10%)</option>
    <option value="0.046">Forearms (4.6%)</option>
    <option value="0.014">Hands (1.4%)</option>
  </optgroup>
</select>
</label>

<!-- STEP 2 -->
<div class="step-title">Step 2 — Weight Loss</div>

<label>Previous/usual weight (kg)
  <input id="prevWeight" type="number" step="0.1">
</label>

<label>Amputation status at time of previous/usual weight
<select id="priorAmp">
  <option value="0">No amputation</option>

  <optgroup label="Lower limb (unilateral)">
    <option value="0.16">Full lower limb (16%)</option>
    <option value="0.097">Above knee / thigh (9.7%)</option>
    <option value="0.059">Below knee + foot (5.9%)</option>
    <option value="0.014">Foot (1.4%)</option>
    <option value="0.007">Half foot (0.7%)</option>
  </optgroup>

  <optgroup label="Lower limb (bilateral)">
    <option value="0.32">Full lower limbs (32%)</option>
    <option value="0.194">Above knee / thigh (19.4%)</option>
    <option value="0.118">Below knee + foot (11.8%)</option>
    <option value="0.028">Feet (2.8%)</option>
    <option value="0.014">Half feet (1.4%)</option>
  </optgroup>

  <optgroup label="Upper limb (unilateral)">
    <option value="0.05">Full upper limb (5%)</option>
    <option value="0.023">Forearm (2.3%)</option>
    <option value="0.007">Hand (0.7%)</option>
  </optgroup>

  <optgroup label="Upper limb (bilateral)">
    <option value="0.10">Full upper limbs (10%)</option>
    <option value="0.046">Forearms (4.6%)</option>
    <option value="0.014">Hands (1.4%)</option>
  </optgroup>
</select>
</label>

<label>Time since previous/usual weight (months)
  <input id="months" type="number">
</label>

<!-- STEP 3 -->
<div class="step-title">Step 3</div>

<label>
Patient is acutely ill <strong>and</strong> there has been or is likely to be no nutritional intake for &gt;5 days
<select id="acute">
  <option value="0">No</option>
  <option value="2">Yes — score 2</option>
</select>
</label>

<button id="calculateBtn">Calculate MUST Score</button>

<div id="output" class="result" style="display:none"></div>

<script>
function bmiScore(bmi) {
  if (bmi < 18.5) return 2;
  if (bmi < 20) return 1;
  return 0;
}

function weightLossScore(pct) {
  if (pct >= 10) return 2;
  if (pct >= 5) return 1;
  return 0;
}

document.getElementById("calculateBtn").addEventListener("click", function () {

  const obsWeight = parseFloat(document.getElementById("obsWeight").value);
  const prevWeight = parseFloat(document.getElementById("prevWeight").value);
  const height = parseFloat(document.getElementById("heightM").value);
  const currentAmp = parseFloat(document.getElementById("currentAmp").value);
  const priorAmp = parseFloat(document.getElementById("priorAmp").value);
  const months = parseFloat(document.getElementById("months").value || 0);
  const acute = parseInt(document.getElementById("acute").value);

  if (!obsWeight || !prevWeight || !height) {
    alert("Please complete height and both weights.");
    return;
  }

  const adjustedCurrentWeight = obsWeight / (1 - currentAmp);
  const adjustedPreviousWeight = priorAmp > 0
    ? prevWeight / (1 - priorAmp)
    : prevWeight;

  const bmi = adjustedCurrentWeight / (height * height);
  const bmiStep = bmiScore(bmi);

  const wlPercent = Math.max(
    0,
    ((adjustedPreviousWeight - adjustedCurrentWeight) / adjustedPreviousWeight) * 100
  );
  const wlRounded = Math.round(wlPercent * 10) / 10;
  const wlStep = weightLossScore(wlRounded);

  const total = bmiStep + wlStep + acute;

  let risk, action, steps;
  if (total === 0) {
    risk = "low";
    action = "Routine Clinical Care";
    steps = ["Repeat MUST screening weekly"];
  } else if (total === 1) {
    risk = "medium";
    action = "Observe";
    steps = [
      "Document dietary intake for 3 days",
      "If adequate — repeat screening weekly",
      "If inadequate — follow local nutrition policy"
    ];
  } else {
    risk = "high";
    action = "Treat";
    steps = [
      "Refer to dietitian",
      "Set nutritional goals",
      "Monitor and review weekly"
    ];
  }

  const warning = months > 6
    ? `<div class="warning">⚠️ Previous/usual weight &gt;6 months old — interpret with caution</div>`
    : "";

  document.getElementById("output").style.display = "block";
  document.getElementById("output").innerHTML = `
    <div class="step-title">Step 1</div>
    BMI: <strong>${bmi.toFixed(1)} kg/m²</strong> (score ${bmiStep})

    <div class="step-title">Step 2</div>
    Weight loss: <strong>${wlRounded}%</strong> (score ${wlStep})
    ${warning}

    <div class="step-title">Step 3</div>
    Acute disease effect score: <strong>${acute}</strong>

    <hr>
    <strong>Total MUST score:</strong> ${total}<br>
    <strong>Risk:</strong> <span class="risk-${risk}">${risk.toUpperCase()}</span><br><br>

    <strong>${action}</strong>
    <ul>${steps.map(s => `<li>${s}</li>`).join("")}</ul>
  `;
});
</script>

</body>
</html>

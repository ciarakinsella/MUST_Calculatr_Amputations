<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MUST Calculator — Amputation Adjusted</title>

<style>
:root {
  --accent:#0057ff;
  --accent-dark:#003bb8;
  --border:#d0d7ff;
  --card:#f2f5ff;
}

body {
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  margin:20px;
  max-width:760px;
  line-height:1.55;
}

h1 { color:var(--accent-dark); font-size:1.8rem; }

.step-title {
  margin-top:28px;
  font-size:1.4rem;
  font-weight:700;
  color:var(--accent-dark);
}

label {
  display:block;
  margin-top:14px;
  font-weight:600;
}

input, select {
  width:100%;
  padding:14px;
  margin-top:6px;
  font-size:1rem;
  border:2px solid var(--border);
  border-radius:8px;
}

button {
  width:100%;
  margin-top:22px;
  padding:16px;
  font-size:1.2rem;
  font-weight:700;
  background:var(--accent);
  color:white;
  border:none;
  border-radius:8px;
}

button:active { background:var(--accent-dark); }

.result {
  margin-top:24px;
  padding:18px;
  background:var(--card);
  border-radius:10px;
  border:1px solid var(--border);
}

.warning {
  margin-top:12px;
  padding:12px;
  background:#fff7ed;
  border-left:5px solid #f59e0b;
  font-weight:600;
  color:#92400e;
}

.row { display:flex; gap:8px; }

hr {
  margin:16px 0;
  border:0;
  border-top:2px solid var(--border);
}

.risk-low { color:green; font-weight:700; }
.risk-medium { color:#ff8c00; font-weight:700; }
.risk-high { color:red; font-weight:700; }
</style>
</head>

<body>

<h1>MUST – Amputation-Adjusted Calculator</h1>

<!-- STEP 1 -->
<div class="step-title">Step 1 — BMI</div>

<label>Height (m)
  <input id="heightM" type="number" step="0.01">
</label>

<label>Weight (kg)
  <input id="obsWeight" type="number" step="0.1">
</label>

<label>Current amputation level
<select id="currentAmp">
  <option value="0">No amputation</option>
  <option value="0.16">Unilateral lower limb (16%)</option>
  <option value="0.32">Bilateral lower limbs (32%)</option>
  <option value="0.05">Unilateral upper limb (5%)</option>
  <option value="0.10">Bilateral upper limbs (10%)</option>
</select>
</label>

<!-- STEP 2 -->
<div class="step-title">Step 2 — Weight Loss</div>

<label>Previous/usual weight (kg)
  <input id="prevWeight" type="number" step="0.1">
</label>

<label>Amputation status at time of previous weight
<select id="priorAmp">
  <option value="0">No amputation</option>
  <option value="0.16">Unilateral lower limb (16%)</option>
  <option value="0.32">Bilateral lower limbs (32%)</option>
  <option value="0.05">Unilateral upper limb (5%)</option>
  <option value="0.10">Bilateral upper limbs (10%)</option>
</select>
</label>

<label>Time since previous/usual weight</label>
<div class="row">
  <input id="months" type="number" placeholder="Months">
  <input id="years" type="number" placeholder="Years">
</div>

<!-- STEP 3 -->
<div class="step-title">Step 3</div>

<label>
Patient is acutely ill <strong>and</strong> there has been or is likely to be no nutritional intake for &gt;5 days
<select id="acute">
  <option value="0">No</option>
  <option value="2">Yes — score 2</option>
</select>
</label>

<button id="calc">Calculate MUST Score</button>

<div id="out" class="result" style="display:none"></div>

<script>
const bmiScore=b=>b<18.5?2:b<20?1:0;
const wlScore=p=>p>=10?2:p>=5?1:0;

calc.onclick=()=>{
  const obs=+obsWeight.value;
  const prev=+prevWeight.value;
  const height=+heightM.value;
  const currP=+currentAmp.value;
  const priorP=+priorAmp.value;
  const acuteScore=+acute.value;
  const months=(+months.value||0)+(+years.value||0)*12;

  if(!obs||!prev||!height){
    alert("Please complete required fields");
    return;
  }

  const adjCurrent=obs/(1-currP);
  const adjPrev=priorP>0 ? prev/(1-priorP) : prev;

  const bmi=adjCurrent/(height*height);
  const wl=Math.max(0,Math.round(((adjPrev-adjCurrent)/adjPrev)*1000)/10);

  const step1=bmiScore(bmi);
  const step2=wlScore(wl);
  const step3=acuteScore;
  const total=step1+step2+step3;

  let risk,action,steps=[];
  if(total===0){
    risk="low"; action="Routine Clinical Care";
    steps=["Repeat MUST screening weekly"];
  } else if(total===1){
    risk="medium"; action="Observe";
    steps=["Document intake for 3 days","Repeat screening weekly"];
  } else {
    risk="high"; action="Treat";
    steps=["Refer to dietitian","Monitor weekly"];
  }

  const warning = months>6
    ? `<div class="warning">⚠️ Previous weight &gt;6 months old — interpret with caution</div>`
    : "";

  out.style.display="block";
  out.innerHTML=`
    <div class="step-title">Step 1</div>
    BMI: <strong>${bmi.toFixed(1)} kg/m²</strong> (score ${step1})<br><br>

    <div class="step-title">Step 2</div>
    Weight loss: <strong>${wl}%</strong> (score ${step2})
    ${warning}<br>

    <div class="step-title">Step 3</div>
    Acute disease score: <strong>${step3}</strong><br>

    <hr>
    <strong>Total MUST score:</strong> ${total}<br>
    <strong>Risk:</strong> <span class="risk-${risk}">${risk.toUpperCase()}</span><br><br>

    <strong>${action}</strong>
    <ul>${steps.map(s=>`<li>${s}</li>`).join("")}</ul>
  `;
};
</script>

</body>
</html>
